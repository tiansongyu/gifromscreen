[package]
name = "gif-from-screen-capture-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux Wayland/X11 capture adapter for GifFromScreen"

[features]
default = []
# Native dependencies are deliberately opt-in so the portable workspace and
# headless CI do not require PipeWire development packages or an X server.
wayland-portal = ["dep:ashpd", "dep:tokio"]
native-wayland = [
    "wayland-portal",
    "dep:libspa",
    "dep:libspa-sys",
    "dep:pipewire",
    "dep:pipewire-sys",
]
native-x11 = ["dep:x11rb"]

[dependencies]
gif-from-screen-capture = { path = "../capture" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", optional = true, features = ["screencast"] }
# pipewire-rs 0.6 declares these native crates with broad `version = "0"`
# requirements. Exact direct pins keep a fresh lockfile compatible with the
# PipeWire 0.3.48 ABI instead of silently mixing newer binding generations.
libspa = { version = "=0.6.0", optional = true }
libspa-sys = { version = "=0.6.0", optional = true }
pipewire = { version = "=0.6.0", optional = true }
pipewire-sys = { version = "=0.6.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time"] }
x11rb = { version = "0.14", optional = true, features = ["randr", "xfixes"] }

[lints]
workspace = true
