name: Publish release installer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/gifromscreen-installer.sh'
      - 'scripts/test_release_installer.py'
      - '.github/workflows/release-installer.yml'
  pull_request:
    paths:
      - 'scripts/gifromscreen-installer.sh'
      - 'scripts/test_release_installer.py'
      - '.github/workflows/release-installer.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installer to
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: |
          shellcheck scripts/gifromscreen-installer.sh
          python3 scripts/test_release_installer.py
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Attach the standalone installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" scripts/gifromscreen-installer.sh --clobber
