name: Manual Cinemagraph WPF probe

# Evidence-only experiment. Do not modify or replace the strict WPF reference gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinemagraph-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested probe revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Install .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Inspect actual SDK and desktop runtime
        working-directory: scripts/qa/cinemagraph_probe
        shell: pwsh
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw "SDK inspection failed" }
          dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0) { throw "Runtime inspection failed" }
      - name: Build only the independent headless probe
        working-directory: scripts/qa/cinemagraph_probe
        shell: pwsh
        run: |
          dotnet build CinemagraphProbe.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Probe build failed" }
      - name: Run the bounded actual-WPF experiment
        shell: pwsh
        env:
          GFS_CINEMAGRAPH_PROBE_DIR: ${{ runner.temp }}/gfs-cinemagraph-probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/qa/cinemagraph_probe/run-probe.ps1 -OutputDirectory "$env:GFS_CINEMAGRAPH_PROBE_DIR"
      - name: Preserve measured pixels and provenance, including partial failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cinemagraph-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-cinemagraph-probe-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve bounded child diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cinemagraph-probe-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-cinemagraph-probe-${{ github.run_id }}-${{ github.run_attempt }}.logs/
          if-no-files-found: warn
          retention-days: 7

  compare-snapshots-linux:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact matching Rust revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Download the completed independent Windows corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cinemagraph-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-cinemagraph-reference
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Cache the pure Rust comparison build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cinemagraph-snapshots-rust188
      - name: Build the typed snapshot comparator
        run: cargo test --locked -p gif-from-screen-render --test cinemagraph_reference --no-run
      - name: Verify snapshot persistence and composition, not Ink geometry generation
        env:
          GFS_CINEMAGRAPH_PROBE_DIR: ${{ runner.temp }}/gfs-cinemagraph-reference
        run: >-
          timeout --signal=TERM --kill-after=10s 120s
          cargo test --locked -p gif-from-screen-render --test cinemagraph_reference
          real_windows_clipped_snapshots_match_all_compositor_routes_exactly
          -- --ignored --exact --nocapture --test-threads=1
      - name: Build the strict ink center-sample comparator
        run: cargo test --locked -p gif-from-screen-render --test ink_reference --no-run
      - name: Verify original and fitted center samples, not outline or erasure pixels
        env:
          GFS_CINEMAGRAPH_PROBE_DIR: ${{ runner.temp }}/gfs-cinemagraph-reference
        run: >-
          timeout --signal=TERM --kill-after=10s 120s
          cargo test --locked -p gif-from-screen-render --test ink_reference
          compare_windows_ink_samples
          -- --ignored --exact --nocapture --test-threads=1
