name: WPF pixel reference

# The first complete hosted producer/comparator passed on 35c246b. Relevant
# changes now regenerate an independent reference and must match it exactly.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wpf-reference.yml'
      - 'scripts/qa/wpf_reference/**'
      - 'scripts/qa/run_wpf_reference.ps1'
      - 'crates/domain/**'
      - 'crates/render/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/wpf-reference.yml'
      - 'scripts/qa/wpf_reference/**'
      - 'scripts/qa/run_wpf_reference.ps1'
      - 'crates/domain/**'
      - 'crates/render/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: wpf-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GFS_STG_SHAPES_ROOT: ${{ github.workspace }}/stg-shapes-reference
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Check out the exact original shape definitions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: NickeManarin/ScreenToGif
          ref: a4d0a67c2131cd048ceec86cd40afc2f1a06f2fd
          path: stg-shapes-reference
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ScreenToGif/Controls/Shapes/Triangle.cs
            /ScreenToGif/Controls/Shapes/Arrow.cs
      - name: Inspect the actual SDK and desktop runtime
        working-directory: scripts/qa/wpf_reference
        run: |
          dotnet --info
          dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0) { throw "dotnet inspection failed" }
      - name: Build the headless reference generator
        working-directory: scripts/qa/wpf_reference
        run: dotnet build WpfReference.csproj --configuration Release
      - name: Generate bounded real WPF reference images
        shell: pwsh
        env:
          GFS_WPF_REFERENCE_DIR: ${{ runner.temp }}/gfs-wpf-reference-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          ./scripts/qa/run_wpf_reference.ps1
          -FixturePath ./scripts/qa/wpf_reference/fixtures.json
          -OutputDirectory "$env:GFS_WPF_REFERENCE_DIR"
      - name: Preserve reference images and provenance, including partial failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wpf-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-wpf-reference-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve generator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wpf-reference-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-wpf-reference-${{ github.run_id }}-${{ github.run_attempt }}.logs/
          if-no-files-found: warn
          retention-days: 7

  compare-linux:
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the matching renderer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Download this run's independent Windows reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wpf-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-wpf-downloaded-reference
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Cache pure Rust comparison dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wpf-reference-rust188
      - name: Build only the platform-independent renderer comparator
        run: cargo test --locked -p gif-from-screen-render --test wpf_reference --no-run
      - name: Strictly compare every fixture and stage
        env:
          GFS_WPF_REFERENCE_DIR: ${{ runner.temp }}/gfs-wpf-downloaded-reference
          GFS_WPF_COMPARE_DIR: ${{ runner.temp }}/gfs-wpf-comparison
        run: >-
          timeout --signal=TERM --kill-after=10s 120s
          cargo test --locked -p gif-from-screen-render --test wpf_reference
          compare_windows_wpf_reference -- --ignored --exact --nocapture --test-threads=1
      - name: Preserve actual pixels, differences and machine-readable results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wpf-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfs-wpf-comparison/
          if-no-files-found: warn
          retention-days: 7
